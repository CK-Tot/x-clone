<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Clone</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <nav class="nav">
        <a href="#" class="folowing active">For You</a>
        <a href="#" class="folowing">Following</a>
    </nav>
    <main class="dashboard">
        <div class="input-container">
            <div class="input-content">
                <div class="img-container">
                     <img src="images/profile-pic.jpg" alt="Profile picture" class="profile-pic">
                </div>
                <textarea name="input-box" id="input-box" placeholder="What's happening?"></textarea>
            </div>

            <div class="input-icons">
                <div class="icons">
                    <input type="file" id="file-input" accept="image/*">
                    <label for="file-input">
                        <i class="fa-regular fa-images"></i>
                    </label>
                    <a href="#" class="emoji-icons"><i class="fa-regular fa-face-smile"></i></a>
                    <a href="#"><i class="fa-solid fa-location-dot"></i></a>
                    <a href="#"><i class="fa-solid fa-flag"></i></a>
                </div>
                <div class="btn-container">
                    <button class="post-btn">Post</button>
                </div>
            </div>
        </div>

        <div class="tweet-feed">
            <div class="tweet-content">
                <div class="inner-container">
                    <div class="tweet-header">
                        <div class="img-container">
                        <img src="images/profile-pic.jpg" alt="user handle" class="feed-pic">
                    </div>
                    <div class="user-info">
                        <h3 class="user-name">CkThaEngineer<i class="fa-solid fa-circle-check"></i></h3>
                        <span class="user-handle">@ckthaengineer</span>
                    </div>
                    </div>
                    
                    <div class="tweet-txt-info">
                        <p class="tweet-text">Hello world 🌎 🙌🏾</p>
                    </div>

                    <div class="tweet-interactions">
                        <span class="tweet-comment">
                            <i class="fa-regular fa-comment"></i>
                            12
                        </span>
                        <span class="tweet-rewteet">
                           <i class="fa-solid fa-retweet"></i>
                            3
                        </span>
                        <span class="tweet-like">
                            <i class="fa-solid  fa-heart" ></i>
                            12
                        </span>
                    </div>
                    
                </div>
            </div>
            <div class="tweet-content">
                <div class="inner-container">
                    <div class="tweet-header">
                        <div class="img-container">
                        <img src="images/profile-pic.jpg" alt="user handle" class="feed-pic">
                    </div>
                    <div class="user-info">
                        <h3 class="user-name">CkThaEngineer<i class="fa-solid fa-circle-check"></i></h3>
                        <span class="user-handle">@ckthaengineer</span>
                    </div>
                    </div>
                    
                    <div class="tweet-txt-info">
                        <p class="tweet-text">Hello world 🌎 🙌🏾</p>
                    </div>

                    <div class="tweet-interactions">
                        <span class="tweet-comment">
                            <i class="fa-regular fa-comment"></i>
                            12
                        </span>
                        <span class="tweet-rewteet">
                           <i class="fa-solid fa-retweet"></i>
                            3
                        </span>
                        <span class="tweet-like">
                            <i class="fa-solid  fa-heart" ></i>
                            12
                        </span>
                    </div>
                    
                </div>
            </div>
            <div class="tweet-content">
                <div class="inner-container">
                    <div class="tweet-header">
                        <div class="img-container">
                        <img src="images/profile-pic.jpg" alt="user handle" class="feed-pic">
                    </div>
                    <div class="user-info">
                        <h3 class="user-name">CkThaEngineer<i class="fa-solid fa-circle-check"></i></h3>
                        <span class="user-handle">@ckthaengineer</span>
                    </div>
                    </div>
                    
                    <div class="tweet-txt-info">
                        <p class="tweet-text">Hello world 🌎 🙌🏾</p>
                    </div>

                    <div class="tweet-interactions">
                        <span class="tweet-comment">
                            <i class="fa-regular fa-comment"></i>
                            12
                        </span>
                        <span class="tweet-rewteet">
                           <i class="fa-solid fa-retweet"></i>
                            3
                        </span>
                        <span class="tweet-like">
                            <i class="fa-solid  fa-heart" ></i>
                            12
                        </span>
                    </div>
                    
                </div>
            </div>
           
        </div>
        
    </main>
    


    <script type="module" src="scripts/app.js"></script>
</body>
</html>
